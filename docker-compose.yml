services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333" # dashboard/API reachable from your host
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage # named volume = data survives restarts

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env # injects API keys at runtime (NOT baked in)
    environment:
      - QDRANT_URL=http://qdrant:6333 # reach Qdrant by service name
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 # host Ollama (optional)
    volumes:
      - ./docs:/app/docs # your documents, shared with the container
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80" # open the app at http://localhost:3000
    depends_on:
      - backend

volumes:
  qdrant_data:
