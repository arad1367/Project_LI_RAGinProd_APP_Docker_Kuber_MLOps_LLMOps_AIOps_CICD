apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
          emptyDir: {} # simple ephemeral storage for the demo
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant # backend reaches Qdrant at http://qdrant:6333
spec:
  selector: { app: qdrant }
  ports:
    - port: 6333
      targetPort: 6333
